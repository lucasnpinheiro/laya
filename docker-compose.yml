services:
  # Reinicia o laya-api quando o healthcheck fica "unhealthy" (o Docker não faz isso sozinho).
  # ATENÇÃO: o socket montado dá acesso root ao host (a flag :ro só vale para o arquivo, não restringe a API).
  # Desligar: `docker compose stop autoheal`.
  autoheal:
    image: willfarrell/autoheal:1.2.0@sha256:31f580ef0279eaced5b38d631b08c474d70d8403c1c2fdd6ddcf2e879d5f3f7c
    container_name: autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=240
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 64m

  laya-api:
    image: laya-api:latest
    pull_policy: build
    build:
      context: .
      pull: true
      no_cache: true
    container_name: laya-api
    labels:
      - autoheal=true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OMP_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - HF_HUB_OFFLINE=0
      - LOG_LEVEL=INFO
      - LOG_BODY_MAX=10000
      - LAYA_LOWMEM=1
      - LAYA_WARMUP=english
      - LAYA_DEFAULT_MODEL=multilingual
      - LAYA_MAX_LOADED=${LAYA_MAX_LOADED:-2}
      - LAYA_PRELOAD=${LAYA_PRELOAD:-0}
      - LAYA_REVISION=main
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - laya-hf-cache:/home/laya/.cache/huggingface
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1500m
    memswap_limit: 4g
    cpus: 6
    cpu_shares: 2048
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8000/health | grep -q '\"warmed\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
      start_interval: 5s

volumes:
  laya-hf-cache:
