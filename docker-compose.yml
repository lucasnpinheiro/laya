services:
  laya-api:
    build: .
    container_name: laya-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - OMP_NUM_THREADS=6
      - MKL_NUM_THREADS=6
      - HF_HUB_OFFLINE=0
      - LOG_LEVEL=INFO
      - LOG_BODY_MAX=10000
      - LAYA_LOWMEM=1
      - LAYA_WARMUP=english
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - laya-hf-cache:/home/laya/.cache/huggingface
    restart: unless-stopped
    mem_limit: 3g
    mem_reservation: 1500m
    memswap_limit: 4g
    cpus: 6
    cpu_shares: 2048
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8000/health | grep -q '\"warmed\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 3m
      start_interval: 5s

volumes:
  laya-hf-cache:
